<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Explore your Spotify listening history, favorite tracks, artists, and listening stats.">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Stats for Spotify</title>
<link rel="stylesheet" href="Style.css">
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="bars big"><i></i><i></i><i></i><i></i></div>
    <h1>Stats for Spotify</h1>
    <p>Your listening history, top tracks and artists, merged with your extended streaming history.</p>
    <button id="loginBtn" class="btn primary">Connect Spotify</button>
    <p id="loginMsg" class="muted small"></p>
  </div>
</section>

<div id="app" hidden>
  <div class="amb"><i></i><i></i><i></i></div>
  <div class="shell">
    <aside class="side">
      <div class="logo"><div class="bars"><i></i><i></i><i></i><i></i></div><span>Stats</span></div>
      <nav id="tabs"></nav>
    </aside>
    <div class="stage">
      <header class="top">
        <h1 id="hello" class="hello">Hello!</h1>
        <label class="gs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="gq" type="search" placeholder="Search music…" autocomplete="off">
        </label>
        <button id="themeBtn" class="ib" aria-label="Toggle theme"></button>
        <button id="logoutBtn" class="ib" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
        <img id="avatar" alt="" hidden>
      </header>
      <main id="view"></main>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="app.js"></script>
<script src="player.js"></script>
<script src="hero.js"></script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
